<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majeur Magique Production - Le Morpion Magique</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f111a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px 15px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h2.prod {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #9a8c98;
            margin-bottom: 5px;
        }

        p.presente {
            font-size: 0.9rem;
            color: #c9ada7;
            font-style: italic;
            margin-bottom: 5px;
        }

        h1.titre {
            font-size: 2rem;
            color: #f2e9e4;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* Conteneur Spotify */
        .spotify-container {
            width: 100%;
            max-width: 420px;
            margin-bottom: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
        }

        /* Tableau des Scores */
        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 15px;
            background: #1e1e2f;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #3d3b54;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .score-item {
            text-align: center;
            font-size: 0.9rem;
            color: #c9ada7;
        }

        .score-item span {
            display: block;
            font-size: 1.3rem;
            font-weight: bold;
            color: #f2e9e4;
            margin-top: 2px;
        }

        /* Statut */
        .status {
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: 600;
            color: #f2e9e4;
            min-height: 1.5em;
            text-align: center;
        }

        /* Grille de jeu */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(3, 90px);
            gap: 10px;
            background-color: #22223b;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        .cell {
            background-color: #4a4e69;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .cell:hover {
            background-color: #6c757d;
        }

        .cell.taken {
            cursor: not-allowed;
        }

        /* Bouton Recommencer */
        .btn-reset {
            background: #e63946;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s ease;
            margin-bottom: 30px;
        }

        .btn-reset:hover {
            background: #d62828;
        }

        /* Liens Réseaux */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
            width: 100%;
            max-width: 320px;
        }

        .social-btn {
            display: block;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 0.95rem;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .social-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .btn-spotify {
            background: #1DB954;
        }

        .btn-youtube {
            background: #FF0000;
        }
    </style>
</head>
<body>

    <header>
        <h2 class="prod">Majeur Magique Production</h2>
        <p class="presente">présente</p>
        <h1 class="titre">LE MORPION MAGIQUE</h1>
    </header>

    <!-- Lecteur Playlist Spotify -->
    <div class="spotify-container">
        <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/5Ozukpsivz9kbx5VZIoyW2?utm_source=generator&si=77269b102d0946fe" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <!-- Tableau des Scores -->
    <div class="scoreboard">
        <div class="score-item">Blanc (🖕🏻)<span id="scoreX">0</span></div>
        <div class="score-item">Nulle<span id="scoreDraw">0</span></div>
        <div class="score-item">Noir (🖕🏿)<span id="scoreO">0</span></div>
    </div>

    <div class="status" id="status">À toi de jouer (Majeur Blanc)</div>

    <!-- Grille de jeu -->
    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <button class="btn-reset" id="resetBtn">Recommencer la partie</button>

    <!-- Liens Artiste -->
    <div class="social-links">
        <a href="https://open.spotify.com/intl-fr/artist/34x3q4Dm8ucUgCh6VZlEO9?si=OidttA_4TcmcO2bukYIYIg" target="_blank" rel="noopener noreferrer" class="social-btn btn-spotify">
            C.E.D.R.I.C. sur Spotify !
        </a>
        <a href="https://www.youtube.com/@cedricMMP/videos" target="_blank" rel="noopener noreferrer" class="social-btn btn-youtube">
            C.E.D.R.I.C. sur YouTube !
        </a>
    </div>

    <script>
        const board = document.getElementById('board');
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');

        const scoreXText = document.getElementById('scoreX');
        const scoreOText = document.getElementById('scoreO');
        const scoreDrawText = document.getElementById('scoreDraw');

        let scores = { X: 0, O: 0, Draw: 0 };
        let currentPlayer = "🖕🏻"; // Majeur Blanc (X)
        let gameState = ["", "", "", "", "", "", "", "", ""];
        let gameActive = true;

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function handleCellClick(e) {
            const clickedCell = e.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            if (gameState[clickedCellIndex] !== "" || !gameActive) return;

            gameState[clickedCellIndex] = currentPlayer;
            clickedCell.textContent = currentPlayer;
            clickedCell.classList.add('taken');

            checkResult();
        }

        function checkResult() {
            let roundWon = false;

            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                statusText.textContent = `Victoire du Majeur ${currentPlayer === "🖕🏻" ? "Blanc" : "Noir"} ! 🎉`;
                if (currentPlayer === "🖕🏻") {
                    scores.X++;
                    scoreXText.textContent = scores.X;
                } else {
                    scores.O++;
                    scoreOText.textContent = scores.O;
                }
                gameActive = false;
                return;
            }

            if (!gameState.includes("")) {
                statusText.textContent = "Match nul ! 🤝";
                scores.Draw++;
                scoreDrawText.textContent = scores.Draw;
                gameActive = false;
                return;
            }

            currentPlayer = currentPlayer === "🖕🏻" ? "🖕🏿" : "🖕🏻";
            statusText.textContent = `Au tour du Majeur ${currentPlayer === "🖕🏻" ? "Blanc" : "Noir"}`;
        }

        function resetGame() {
            gameState = ["", "", "", "", "", "", "", "", ""];
            gameActive = true;
            currentPlayer = "🖕🏻";
            statusText.textContent = "À toi de jouer (Majeur Blanc)";
            cells.forEach(cell => {
                cell.textContent = "";
                cell.classList.remove('taken');
            });
        }

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        resetBtn.addEventListener('click', resetGame);
    </script>
</body>
</html>
