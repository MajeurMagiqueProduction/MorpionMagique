<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majeur Magique Production</title>
    <!-- Police style script / manuscrite -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1f0edd;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 20px;
            text-align: center;
        }

        /* Logo */
        .logo-container {
            margin-bottom: 25px;
        }

        .logo-container img {
            max-width: 140px;
            height: auto;
            filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.3));
        }

        /* Titre en Impact gras */
        h1.main-title {
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: 2.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
        }

        /* Sous-titre en style Script */
        .subtitle {
            font-family: 'Caveat', cursive, sans-serif;
            font-size: 1.8rem;
            max-width: 650px;
            line-height: 1.4;
            margin-bottom: 35px;
        }

        .subtitle a {
            color: #ffffff;
            text-decoration: underline;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .subtitle a:hover {
            opacity: 0.8;
        }

        /* Section Visite & Liens Réseaux */
        .visit-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }

        .visit-title {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .social-link {
            display: block;
            width: 100%;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.25);
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.05rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            h1.main-title {
                font-size: 2.2rem;
            }
            .subtitle {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Audio en lecture automatique caché -->
    <audio id="bgAudio" src="naissance.mp3" autoplay loop></audio>

    <!-- Logo -->
    <div class="logo-container">
        <img src="logo-blanc.png" alt="Logo Majeur Magique">
    </div>

    <!-- Titre -->
    <h1 class="main-title">Majeur Magique Production</h1>

    <!-- Sous-titre avec liens vers les deux jeux -->
    <p class="subtitle">
        Site en construction. En attendant écoute quelques sons en jouant au <a href="morpion.html">morpion</a> ou au <a href="puissance4.html">jeu du 4 majeur</a>.
    </p>

    <!-- Liens Réseaux Sociaux -->
    <div class="visit-section">
        <span class="visit-title">Ou visite :</span>
        <a href="https://www.youtube.com/@cedricMMP" target="_blank" rel="noopener noreferrer" class="social-link">📺 La chaîne Youtube</a>
        <a href="https://open.spotify.com/intl-fr/artist/34x3q4Dm8ucUgCh6VZlEO9?si=SbJMkvwjSWOgVOR5bGPS2g" target="_blank" rel="noopener noreferrer" class="social-link">🎧 Le Spotify</a>
        <a href="https://www.facebook.com/MajeurMagiqueProduction/" target="_blank" rel="noopener noreferrer" class="social-link">📘 La page Facebook</a>
        <a href="https://www.instagram.com/c.e.d.r.i.c.mmp/" target="_blank" rel="noopener noreferrer" class="social-link">📷 L'Instagram</a>
    </div>

    <script>
        // Déblocage de l'autoplay si le navigateur bloque le son au premier clic
        document.addEventListener('click', function() {
            const audio = document.getElementById('bgAudio');
            if (audio.paused) {
                audio.play();
            }
        }, { once: true });
    </script>
</body>
</html>
